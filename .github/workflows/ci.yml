name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install edacore (dev extras)
        run: python -m pip install -e ".[dev]"

      # Apache-2.0 project, no GPL-family dependencies. "GPL" as a partial
      # match also catches LGPL and AGPL license names.
      - name: License check (no GPL/LGPL/AGPL dependencies)
        run: |
          python -m pip install pip-licenses
          pip-licenses --partial-match --fail-on="GPL"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest -m "not slow"

  lint:
    # mypy's inferred types are sensitive to which numpy version pip
    # resolves. Running it once, pinned, keeps mypy's pass/fail
    # deterministic instead of drifting with whatever version each matrix
    # leg's dependency resolver happens to pick.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install edacore (dev extras, pinned numpy)
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy==2.5.3"

      - name: mypy
        run: mypy src/

  test-min-versions:
    # The dependency floors declared in pyproject.toml are a promise, not
    # just a default from always installing latest. This leg installs
    # exactly those floors, plus the numpy version they themselves
    # require, at the lowest supported Python, and proves the test suite
    # still passes against them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install edacore with pinned minimum dependency versions
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy==1.26.0" "pandas==2.2.0" "scipy==1.15.0" "statsmodels==0.14.0"

      - name: pytest
        run: pytest -m "not slow"
